name: resource-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Install wheel only
        run: python -c "import pathlib, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', str(next(pathlib.Path('dist').glob('*.whl')))])"
      - name: Solver-independent receiver
        run: |
          python -I -c "import importlib.util; assert importlib.util.find_spec('scipy') is None"
          python -I -m metric_aligned_ranking.policy_io verify examples/policy_mixture.json examples/policy_context.json
      - run: python -m pip install ".[retrieval,test]"
      - run: python -I examples/retrieval_workflow.py --output workflow-output
      - run: python -I examples/downstream_evaluation.py --requests workflow-output/requests.json --policies workflow-output/policies.json --gains examples/retrieval/illustrative_gains.json --output workflow-output/evaluation.json
      - run: python -I examples/direct_solver_comparison.py --self-check
      - run: python -I scripts/analysis/summarize_resource_benchmark.py
      - run: python -m pytest -q -p no:cacheprovider
